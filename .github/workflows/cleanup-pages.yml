name: Cleanup Pages history

on:
  schedule:
    - cron: "17 3 * * 0"   # Sundays 03:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  deployments: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old GitHub Pages deployments (keep 3 newest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: 3
        run: |
          set -euo pipefail
          ids=$(gh api -X GET "repos/$REPO/deployments?environment=github-pages" --paginate -q '.[].id' | tac)
          i=0
          for id in $ids; do
            i=$((i+1))
            [ -z "$id" ] && continue
            if [ $i -le $KEEP ]; then
              echo "Keeping deployment $id"
              continue
            fi
            echo "Inactivating deployment $id"
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null
            echo "Deleting deployment $id"
            gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null
          done

      - name: Delete old Pages build workflow runs (keep 20 newest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUNS: 20
        run: |
          set -euo pipefail
          i=0
          gh run list \
            --workflow "Pages build and deployment" \
            --limit 1000 \
            --json databaseId \
            -q '.[].databaseId' \
          | while read -r id; do
              [ -z "$id" ] && continue
              i=$((i+1))
              if [ $i -le $KEEP_RUNS ]; then
                echo "Keeping workflow run $id"
              else
                echo "Deleting workflow run $id"
                gh run delete "$id" --yes
              fi
            done
