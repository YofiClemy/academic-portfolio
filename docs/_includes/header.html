<header class="site-header" role="banner">

  <div class="wrapper site-header__inner">

    <!-- =====================================================
         BRAND
    ====================================================== -->

    <a
      class="site-brand"
      href="{{ '/' | relative_url }}"
      aria-label="Clément Chevauchey — Home"
    >

      <span class="site-brand__mark">
        CC<span>.</span>
      </span>

      <span class="site-brand__name">

    </a>

    ====================================================== -->

              d="

                M18,13.516
                c0,0.82-0.665,1.484-1.484,1.484

      <!-- ===================================================
           MENU ITEMS
      ==================================================== -->

      <div class="trigger">

        <a
          class="page-link"
          href="{{ '/' | relative_url }}#about"
        >
          Profile
        </a>


        <a
          class="page-link"
          href="{{ '/' | relative_url }}#projects"
        >
          Projects
        </a>


        <a
          class="page-link"
          href="{{ '/' | relative_url }}#experience"
        >
          Experience
        </a>


        <a
          class="page-link"
          href="{{ '/cv/' | relative_url }}"
        >
          CV
        </a>


        <a
          class="page-link"
          href="{{ '/' | relative_url }}#contact"
        >
          Contact
        </a>


        <!-- Theme toggle -->

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle light and dark theme"
        >
          ☀︎ Light
        </button>

      </div>

    </nav>

  </div>

</header>
